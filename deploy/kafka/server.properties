# Produkčná konfigurácia brokera (KRaft, 1 uzol). Tajomstvá a adresa sa dopĺňajú z prostredia
# (docker-compose.prod.yml): KAFKA_ADVERTISED_LISTENERS, KAFKA_SSL_KEYSTORE_PASSWORD, KAFKA_SSL_KEY_PASSWORD.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER

# INTERNAL: iba v docker sieti (porty sa nepublikujú), bez autentifikácie, pre naše služby.
# EXTERNAL: verejný listener pre ostatné tímy, SASL_SSL + SCRAM-SHA-512.
listeners=INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
advertised.listeners=INTERNAL://kafka:19092,EXTERNAL://localhost:9094
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL

sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

ssl.keystore.type=PKCS12
ssl.keystore.location=/certs/kafka.keystore.p12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.client.auth=none

# Autorizácia: bez ACL je všetko zakázané. Používateľ `teams` dostane iba READ (pozri kafka-init.sh).
# ANONYMOUS je iba na PLAINTEXT listeneroch (INTERNAL a CONTROLLER), ktoré nie sú publikované von.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:ANONYMOUS

auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
log.dirs=/var/lib/kafka/data
