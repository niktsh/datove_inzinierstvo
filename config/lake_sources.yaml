# Zdroje data lake. Surové správy ukladáme tak, ako prišli (bez normalizácie): lake.message.
# Hodnoty môžu používať ${PREMENNA} / ${PREMENNA:-predvolená} (prostredie + .env).
# Prihlasovacie údaje cudzích tímov patria iba do .env a v tomto súbore sa uvádza len názov
# premennej (username_env / password_env / token_env).
#
# Typy: kafka | sse | ws | rest | custom (vlastný adaptér tímu: lake/adapters/team_XX.py)
# Postup pridania tímu: docs/timy/README.md (príkaz /novy-tim).

sources:
  # Naše vlastné udalosti (vzor, tiež sa ukladajú do lake): consumer group lake-self.
  - team: tuke-krakow
    type: kafka
    bootstrap: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    topics_regex: '^krakow\..*'
    group_id: lake-self

  # Tím 7 (verejné GET, bez prihlasovania): letenky cez SSE, divadlo cez REST.
  # Popis ich rozhrania: docs/timy/team_7.md
  - team: team_7
    type: custom
    class: krakow_di.lake.adapters.team_7:Team7SseAdapter
    url: https://university-data-api.artur-yevdokymov.workers.dev/api/stream?limit=100
  - team: team_7
    type: custom
    class: krakow_di.lake.adapters.team_7:Team7RestAdapter
    url: https://university-data-api.artur-yevdokymov.workers.dev/api/theatre
    interval_seconds: 3600
    page_size: 1000

  # Tím 4: divadlo (Supabase REST, kľúč v hlavičke apikey) a letenky (FastAPI na Renderi).
  # Dva REST zdroje jedného tímu sa líšia názvom kanála. Kľúč patrí do .env (TEAM4_SUPABASE_KEY).
  # Popis ich rozhrania: docs/timy/team_4.md
  - team: team_4
    type: custom
    class: krakow_di.lake.adapters.team_4:Team4RestAdapter
    channel: rest_theatre
    interval_seconds: 21600
    headers:
      apikey: ${TEAM4_SUPABASE_KEY:-}
    endpoints:
      - url: https://zvopbhzdgtxtujobyfgs.supabase.co/rest/v1/theatre_availability_latest
        params: {select: "*", order: "instance_id,price_band_name,ticket_type_name"}
        paginate: true
      - url: https://zvopbhzdgtxtujobyfgs.supabase.co/rest/v1/tickets_sold
        params: {select: "*", order: "event,performance_date,ticket_price"}
        paginate: true
  - team: team_4
    type: custom
    class: krakow_di.lake.adapters.team_4:Team4RestAdapter
    channel: rest_flights
    interval_seconds: 900
    endpoints:
      - url: https://d-tov-in-inierstvo.onrender.com/api/flights

  # --- Ukážky pre cudzie tímy (zapnúť po doplnení ich rozhrania) -----------------------------
