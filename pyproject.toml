[project]
name = "krakow-di"
version = "0.1.0"
description = "Zber leteniek a dát divadla v Krakove, streaming cez Kafku a data lake"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28",
    "jsonschema[format-nongpl]>=4.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krakow_di"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
